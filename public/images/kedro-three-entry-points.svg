<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <rect width="800" height="600" fill="#0d1117"/>

  <text x="400" y="34" fill="#c9d1d9" font-size="17" text-anchor="middle" font-weight="bold">
    Trois portes d'entrée, une fonction vulnérable
  </text>
  <text x="400" y="55" fill="#8b949e" font-size="11" text-anchor="middle">
    valider un seul vecteur ne suffit pas — le bug est dans la fonction qui touche au filesystem
  </text>

  <!-- Three entry points -->
  <!-- 1. CLI -->
  <g transform="translate(30, 90)">
    <rect width="240" height="120" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
    <rect width="240" height="26" rx="6" fill="#58a6ff" fill-opacity="0.15"/>
    <rect y="20" width="240" height="6" fill="#58a6ff" fill-opacity="0.15"/>
    <text x="120" y="18" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="bold">CLI</text>

    <text x="14" y="50" fill="#8b949e" font-size="9">$ kedro run \</text>
    <text x="14" y="68" fill="#c9d1d9" font-size="10">--load-versions=</text>
    <text x="14" y="86" fill="#f85149" font-size="10">"users:../../../secrets"</text>

    <text x="14" y="108" fill="#6e7681" font-size="9">_split_load_versions()</text>
  </g>

  <!-- 2. API Python -->
  <g transform="translate(280, 90)">
    <rect width="240" height="120" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
    <rect width="240" height="26" rx="6" fill="#58a6ff" fill-opacity="0.15"/>
    <rect y="20" width="240" height="6" fill="#58a6ff" fill-opacity="0.15"/>
    <text x="120" y="18" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="bold">API Python</text>

    <text x="14" y="50" fill="#8b949e" font-size="9">catalog.load(</text>
    <text x="14" y="68" fill="#c9d1d9" font-size="10">  "users",</text>
    <text x="14" y="86" fill="#f85149" font-size="10">  version="../../../secrets"</text>
    <text x="14" y="104" fill="#c9d1d9" font-size="10">)</text>
  </g>

  <!-- 3. YAML / load_versions -->
  <g transform="translate(530, 90)">
    <rect width="240" height="120" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
    <rect width="240" height="26" rx="6" fill="#58a6ff" fill-opacity="0.15"/>
    <rect y="20" width="240" height="6" fill="#58a6ff" fill-opacity="0.15"/>
    <text x="120" y="18" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="bold">Config / load_versions</text>

    <text x="14" y="50" fill="#8b949e" font-size="9">DataCatalog.from_config(</text>
    <text x="14" y="68" fill="#c9d1d9" font-size="10">  config,</text>
    <text x="14" y="83" fill="#c9d1d9" font-size="10">  load_versions={</text>
    <text x="14" y="98" fill="#f85149" font-size="10">    "users":"../../../secrets"</text>
    <text x="14" y="113" fill="#c9d1d9" font-size="10">  })</text>
  </g>

  <!-- Three converging arrows -->
  <path d="M 150 215 C 150 250, 280 270, 400 290" stroke="#f85149" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>
  <path d="M 400 215 L 400 290" stroke="#f85149" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>
  <path d="M 650 215 C 650 250, 520 270, 400 290" stroke="#f85149" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>

  <!-- arrowhead -->
  <polygon points="395,290 405,290 400,300" fill="#f85149"/>

  <!-- Vulnerable function -->
  <g transform="translate(170, 310)">
    <rect width="460" height="120" rx="8" fill="#2d0d0d" stroke="#f85149" stroke-width="2"/>
    <rect width="460" height="28" rx="8" fill="#f85149" fill-opacity="0.18"/>
    <rect y="20" width="460" height="8" fill="#f85149" fill-opacity="0.18"/>
    <text x="230" y="20" fill="#f85149" font-size="13" text-anchor="middle" font-weight="bold">
      kedro/io/core.py — fonction vulnérable
    </text>

    <text x="20" y="56" fill="#8b949e" font-size="11">def _get_versioned_path(self, version: str):</text>
    <text x="20" y="78" fill="#c9d1d9" font-size="11">    return self._filepath</text>
    <text x="220" y="78" fill="#f85149" font-size="11" font-weight="bold">/ version /</text>
    <text x="320" y="78" fill="#c9d1d9" font-size="11">self._filepath.name</text>

    <text x="20" y="105" fill="#6e7681" font-size="10" font-style="italic">
      aucune validation : « .. » et séparateurs passent tels quels
    </text>
  </g>

  <!-- arrow down to outcome -->
  <path d="M 400 435 L 400 480" stroke="#f85149" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>
  <polygon points="395,480 405,480 400,490" fill="#f85149"/>

  <!-- Outcome -->
  <g transform="translate(170, 495)">
    <rect width="460" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="28" fill="#8b949e" font-size="11">filesystem I/O :</text>
    <text x="20" y="52" fill="#c9d1d9" font-size="12">data/01_raw/users.csv/</text>
    <text x="200" y="52" fill="#f85149" font-size="12" font-weight="bold">../../../secrets</text>
    <text x="345" y="52" fill="#c9d1d9" font-size="12">/users.csv</text>
    <text x="20" y="70" fill="#3fb950" font-size="11" font-style="italic">
      → résolu en : secrets/users.csv  (fichier hors-scope lu)
    </text>
  </g>
</svg>
